<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Torneo Pallavolo — Manager</title>

  <!-- Librerie esterne -->

  <!-- Stili -->

<body>

<div class="app">
  <div class="topbar">
    <div class="hdr">
      <h1>🏐 Torneo Pallavolo</h1>
      <p id="torneoNomeHdr">Nessun torneo selezionato</p>

      <div class="sync-badge sync-ok" id="syncBadge">

    </div>
  </div>

  <div id="root"></div>
</div>

<!-- Footer -->
<footer class="footer-noemi">
  <p>Progetto e idea di
    <a href="mailto:tnoemi.marcolini@gmail.com" class="link-noemi">Noemi Marcolini</a>
  </p>
</footer>

<!-- Script applicazione (ordine importante: dipendenze prima) -->
<script src="js/config.js"></script>    <!-- nomi squadre, costanti -->
<script src="js/state.js"></script>     <!-- variabili globali -->
<script src="js/storage.js"></script>   <!-- localStorage: sv, lsv, lload -->
<script src="js/utils.js"></script>     <!-- calcoli, shuffle, helpers -->
<script src="js/pdf.js"></script>       <!-- export PDF -->
<script src="js/views.js"></script>     <!-- tutte le funzioni render* -->
