<script>
  const _auth_unused = null; // placeholder
  // Inizializzazione Firebase compat
  const firebaseConfig = {
    apiKey: "AIzaSyB-vk1m84YC8ZBMHHvILdgpAfZyp4C_0ZM",
    authDomain: "torneo-pallavolo-manager.firebaseapp.com",
    projectId: "torneo-pallavolo-manager",
    storageBucket: "torneo-pallavolo-manager.firebasestorage.app",
    messagingSenderId: "423674754433",
    appId: "1:423674754433:web:35dfeb868d726f6272a480"
  };
  firebase.initializeApp(firebaseConfig);
  const _fbAuth = firebase.auth();
  const _fbDb = firebase.firestore();

  // Esponi funzioni per storage.js
  window._fbDb = _fbDb;
  window._fbSetDoc = (ref, data) => ref.set(data);
  window._fbDoc = (db, ...path) => {
    let ref = db;
    for(let i=0;i<path.length;i+=2) ref=ref.collection(path[i]).doc(path[i+1]);
    return ref;
  };

    // Firebase già inizializzato sopra


  let currentUid = null;
  let unsubLive = null;

  // Controlla se loggato
  _fbAuth.onAuthStateChanged(async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    // Verifica attivazione
    const snap = await _fbDb.collection('utenti').doc(user.uid).get();
    if (!snap.exists || snap.data().attivo !== true) {
      await _fbAuth.signOut();
      window.location.href = 'login.html';
      return;
    }
    currentUid = user.uid;
    window._currentUid = user.uid;

    // Carica dati
    setSyncStatus('wait', '⏳ Caricamento...');
    try {
      const dataSnap = await _fbDb.collection('utenti').doc(user.uid).collection('dati').doc('tornei').get();
      if (dataSnap.exists) {
        const data = dataSnap.data();
        // Assicura struttura base
        DB = data && data.tornei ? data : { tornei: {} };
      } else {
        DB = { tornei: {} };
      }
    } catch(e) {
      console.error('Errore caricamento dati:', e);
      DB = { tornei: {} };
    }

    // Avvia listener per aggiornamenti in tempo reale
    unsubLive = _fbDb.collection('utenti').doc(user.uid).collection('dati').doc('tornei')
      .onSnapshot((snap) => {
        if (snap.exists && !snap.metadata.fromCache) {
          DB = snap.data();
          try { new BroadcastChannel('torneo_update').postMessage('update'); } catch(e) {}
        }
      });

    document.body.style.display = '';
    setSyncStatus('ok', '● Connesso');
    initTheme();
    render();
  });

  window.doLogout = async function() {
    if (unsubLive) unsubLive();
    await _fbAuth.signOut();
    window.location.href = 'login.html';
  };
</script>
