<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB-vk1m84YC8ZBMHHvILdgpAfZyp4C_0ZM",
    authDomain: "torneo-pallavolo-manager.firebaseapp.com",
    projectId: "torneo-pallavolo-manager",
    storageBucket: "torneo-pallavolo-manager.firebasestorage.app",
    messagingSenderId: "423674754433",
    appId: "1:423674754433:web:35dfeb868d726f6272a480"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);

  window._fbAuth = auth;
  window._fbDb = db;
  window._fbDoc = doc;
  window._fbGetDoc = getDoc;
  window._fbSetDoc = setDoc;
  window._fbOnSnapshot = onSnapshot;

  let currentUid = null;
  let unsubLive = null;

  // Controlla se loggato
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    // Verifica attivazione
    const snap = await getDoc(doc(db, 'utenti', user.uid));
    if (!snap.exists() || snap.data().attivo !== true) {
      await signOut(auth);
      window.location.href = 'login.html';
      return;
    }
    currentUid = user.uid;
    window._currentUid = user.uid;

    // Carica dati
    setSyncStatus('wait', '⏳ Caricamento...');
    const dataSnap = await getDoc(doc(db, 'utenti', user.uid, 'dati', 'tornei'));
    if (dataSnap.exists()) {
      DB = dataSnap.data();
    } else {
      DB = { tornei: {} };
    }

    // Avvia listener per aggiornamenti in tempo reale
    unsubLive = onSnapshot(doc(db, 'utenti', user.uid, 'dati', 'tornei'), (snap) => {
      if (snap.exists() && snap.metadata.fromCache === false) {
        DB = snap.data();
        // Notifica la live se aperta
        try { new BroadcastChannel('torneo_update').postMessage('update'); } catch(e) {}
      }
    });

    setSyncStatus('ok', '● Connesso');
    initTheme();
    render();
  });

  window.doLogout = async function() {
    if (unsubLive) unsubLive();
    await signOut(auth);
    window.location.href = 'login.html';
  };
</script>
