<!DOCTYPE html>
<html lang="it" style="color-scheme:light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Modulo Iscrizione Torneo</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:#f3f4f6;color:#111;padding:24px 16px;color-scheme:light}
    .card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.08);padding:28px;max-width:640px;margin:0 auto}
    h1{font-size:22px;font-weight:800;margin-bottom:4px;color:#111}
    .torneo-info{font-size:14px;color:#6b7280;margin-bottom:24px}
    .sec{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#2d5fc4;margin:20px 0 10px}
    label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
    input,textarea,select{width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;color:#111;background:#fff;margin-bottom:14px;outline:none;font-family:inherit}
    input:focus,textarea:focus{border-color:#2d5fc4}
    .cat-row{background:#f8f9ff;border-radius:10px;padding:14px;margin-bottom:10px}
    .cat-name{font-size:14px;font-weight:700;margin-bottom:6px}
    .cat-sub{font-size:12px;color:#6b7280;margin-bottom:4px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .btn{width:100%;padding:14px;background:#2d5fc4;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
    .btn:hover{background:#1e4aa0}
    .btn:disabled{background:#9ca3af;cursor:not-allowed}
    .msg-ok{background:#dcfce7;color:#166534;border-radius:8px;padding:14px;font-size:14px;text-align:center;display:none;margin-top:12px}
    .msg-err{background:#fee2e2;color:#991b1b;border-radius:8px;padding:10px;font-size:13px;margin-bottom:12px;display:none}
    .msg-ok.show,.msg-err.show{display:block}
    .loading{text-align:center;padding:40px;color:#6b7280;font-size:15px}
    .error-page{text-align:center;padding:40px;color:#991b1b}
    .header-logo{text-align:center;margin-bottom:20px}
    .header-logo img{max-height:80px;max-width:200px;object-fit:contain}
    .disclaimer{font-size:11px;color:#9ca3af;line-height:1.6;margin-top:16px;padding-top:16px;border-top:1px solid #f0f0f0}
    .checkbox-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
    .checkbox-row input[type=checkbox]{width:auto;margin:0;flex-shrink:0;margin-top:2px}
    .checkbox-row label{font-size:13px;font-weight:400;color:#374151;margin:0}
    .logo-preview{width:64px;height:64px;object-fit:contain;border-radius:8px;background:#f3f4f6;padding:4px;border:1px solid #e5e7eb;display:none}
    .upload-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .upload-btn{padding:8px 14px;background:#f3f4f6;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:#374151;white-space:nowrap}
    @media(max-width:480px){.two-col{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="card" id="mainCard">
  <div class="loading">Caricamento modulo...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyB-vk1m84YC8ZBMHHvILdgpAfZyp4C_0ZM",
  authDomain: "torneo-pallavolo-manager.firebaseapp.com",
  projectId: "torneo-pallavolo-manager",
  storageBucket: "torneo-pallavolo-manager.firebasestorage.app",
  messagingSenderId: "423674754433",
  appId: "1:423674754433:web:35dfeb868d726f6272a480"
});

var db = firebase.firestore();
var params = new URLSearchParams(location.search);
var torneoId = params.get('t');
var uid = params.get('u');
var torneoData = null;
var logoBase64 = '';

function showError(msg) {
  document.getElementById('mainCard').innerHTML =
    '<div class="error-page">' + msg + '</div>';
}

function init() {
  var card = document.getElementById('mainCard');
  if (!torneoId || !uid) {
    showError('Link non valido. Contatta l\'organizzatore.');
    return;
  }
  db.collection('utenti').doc(uid).collection('dati').doc('tornei').get()
    .then(function(snap) {
      if (!snap.exists) { showError('Torneo non trovato.'); return; }
      var dati = snap.data();
      var torneo = dati.tornei && dati.tornei[torneoId];
      if (!torneo) { showError('Torneo non trovato.'); return; }
      if (!torneo.iscrizioniAperte) {
        showError('Le iscrizioni per questo torneo sono chiuse.');
        return;
      }
      torneoData = torneo;
      renderForm(torneo);
    })
    .catch(function(e) {
      showError('Errore caricamento: ' + (e.code || e.message || 'sconosciuto'));
    });
}

function renderForm(t) {
  var card = document.getElementById('mainCard');
  var cfg = t.iscrizioniConfig || {};
  var cats = t.categorie || [];

  var html = '';

  if (cfg.logoOrg) {
    html += '<div class="header-logo"><img src="' + cfg.logoOrg + '" alt="Logo"></div>';
  }

  html += '<h1>' + (t.nome || 'Torneo') + '</h1>';
  html += '<div class="torneo-info">';
  if (cfg.data) html += '&#128197; ' + cfg.data + '&nbsp;&nbsp;';
  if (cfg.scadenza) html += '<br><span style="color:#dc2626;font-size:12px">&#9200; Scadenza: ' + cfg.scadenza + '</span>';
  html += '</div>';

  html += '<div class="sec">Dati societa</div>';
  html += '<div id="errMsg" class="msg-err"></div>';
  html += '<label>Nome societa *</label>';
  html += '<input type="text" id="nomeSoc" placeholder="Es. ASD Pallavolo">';
  html += '<label>Dirigente responsabile *</label>';
  html += '<input type="text" id="dirigente" placeholder="Nome e cognome">';
  html += '<div class="two-col">';
  html += '<div><label>Cellulare *</label><input type="tel" id="cellulare" placeholder="333 1234567"></div>';
  html += '<div><label>Email *</label><input type="email" id="emailSoc" placeholder="info@societa.it"></div>';
  html += '</div>';

  html += '<label>Logo societa (opzionale)</label>';
  html += '<div class="upload-row">';
  html += '<img id="logoPreview" class="logo-preview" src="" alt="Logo">';
  html += '<label class="upload-btn">&#128206; Carica immagine<input type="file" accept="image/*" style="display:none" onchange="handleLogoUpload(this)"></label>';
  html += '<span style="font-size:12px;color:#9ca3af">oppure</span>';
  html += '<input type="url" id="logoUrl" placeholder="URL immagine" style="flex:1;min-width:180px;margin-bottom:0" oninput="handleLogoUrl(this.value)">';
  html += '</div>';

  html += '<div class="sec">Iscrizione squadre</div>';

  for (var i = 0; i < cats.length; i++) {
    var cat = cats[i];
    var info = (cfg.catInfo && cfg.catInfo[cat.id]) || {};
    var col = cat.colore || '#2d5fc4';
    html += '<div class="cat-row" style="border-left:4px solid ' + col + '">';
    html += '<div class="cat-name" style="color:' + col + '">' + (cat.emoji || '') + ' ' + cat.nome + '</div>';
    if (info.formato) html += '<div class="cat-sub">Formato: <b>' + info.formato + '</b></div>';
    if (info.anni) html += '<div class="cat-sub">Anni di nascita: <b>' + info.anni + '</b></div>';
    if (info.minAtleti) html += '<div class="cat-sub">Minimo atleti: <b>' + info.minAtleti + '</b></div>';
    html += '<div class="two-col">';
    html += '<div><label>N&deg; squadre</label><input type="number" min="0" max="20" value="0" id="sq_' + cat.id + '" style="text-align:center"></div>';
    html += '<div><label>N&deg; atleti totali</label><input type="number" min="0" max="999" value="0" id="at_' + cat.id + '" style="text-align:center"></div>';
    html += '</div></div>';
  }

  if (cfg.testoComposizione) {
    html += '<div style="font-size:12px;color:#374151;background:#f8f9ff;border-radius:8px;padding:12px;margin-bottom:14px;line-height:1.6">' + cfg.testoComposizione + '</div>';
  }

  html += '<div class="sec">Accettazione</div>';
  var testoAcc = cfg.testoAccettazione || 'La societa sottoscrivendo il presente modulo dichiara di aver preso visione del regolamento e di accettarlo integralmente.';
  html += '<div class="checkbox-row"><input type="checkbox" id="accetto"><label for="accetto">' + testoAcc + '</label></div>';

  if (cfg.disclaimer) {
    html += '<div class="disclaimer">' + cfg.disclaimer + '</div>';
  }

  html += '<button class="btn" id="inviaBtn" onclick="invia()">Invia iscrizione</button>';
  html += '<div class="msg-ok" id="okMsg">Iscrizione inviata con successo! L\'organizzatore ti contatter&agrave; a breve.</div>';

  card.innerHTML = html;
}

function handleLogoUrl(url) {
  var preview = document.getElementById('logoPreview');
  if (url) {
    preview.src = url;
    preview.style.display = 'block';
    logoBase64 = url;
  } else {
    preview.style.display = 'none';
    logoBase64 = '';
  }
}

function handleLogoUpload(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var max = 300;
      var w = img.width, h = img.height;
      if (w > max || h > max) {
        var r = Math.min(max/w, max/h);
        w = Math.round(w*r); h = Math.round(h*r);
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      logoBase64 = canvas.toDataURL('image/png', 0.85);
      var preview = document.getElementById('logoPreview');
      preview.src = logoBase64;
      preview.style.display = 'block';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function showErr(msg) {
  var el = document.getElementById('errMsg');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  el.scrollIntoView({behavior:'smooth'});
}

function invia() {
  var errEl = document.getElementById('errMsg');
  if (errEl) errEl.classList.remove('show');

  var nome = document.getElementById('nomeSoc').value.trim();
  var dirigente = document.getElementById('dirigente').value.trim();
  var cellulare = document.getElementById('cellulare').value.trim();
  var emailVal = document.getElementById('emailSoc').value.trim();
  var accetto = document.getElementById('accetto').checked;

  if (!nome) { showErr('Inserisci il nome della societa.'); return; }
  if (!dirigente) { showErr('Inserisci il nome del dirigente.'); return; }
  if (!cellulare) { showErr('Inserisci il cellulare.'); return; }
  if (!emailVal) { showErr('Inserisci la email.'); return; }
  if (!accetto) { showErr('Devi accettare il regolamento.'); return; }

  var sqPerCat = {};
  var atlPerCat = {};
  var totSq = 0;
  var cats = torneoData.categorie || [];
  for (var i = 0; i < cats.length; i++) {
    var cat = cats[i];
    var sq = parseInt(document.getElementById('sq_' + cat.id).value) || 0;
    var at = parseInt(document.getElementById('at_' + cat.id).value) || 0;
    sqPerCat[cat.id] = sq;
    atlPerCat[cat.id] = at;
    totSq += sq;
  }
  if (totSq === 0) { showErr('Inserisci almeno una squadra.'); return; }

  var btn = document.getElementById('inviaBtn');
  btn.disabled = true;
  btn.textContent = 'Invio in corso...';

  db.collection('iscrizioni').doc(uid + '_' + torneoId).collection('richieste').add({
    uid: uid,
    torneoId: torneoId,
    nomeSoc: nome,
    dirigente: dirigente,
    cellulare: cellulare,
    email: emailVal,
    logo: logoBase64 || '',
    sqPerCat: sqPerCat,
    atlPerCat: atlPerCat,
    inviatoAt: Date.now(),
    stato: 'attesa'
  }).then(function() {
    document.getElementById('okMsg').classList.add('show');
    btn.style.display = 'none';
  }).catch(function(e) {
    showErr('Errore invio: ' + (e.code || e.message));
    btn.disabled = false;
    btn.textContent = 'Invia iscrizione';
  });
}

init();
</script>
</body>
</html>
