<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>Torneo Pallavolo — Live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:rgba(255,255,255,0.10);--txt:#f0f0f0;--txt2:#888;--accent-w:#4a9eff;--accent-g:#4ade80;--accent-r:#f87171;--footer-text:rgba(255,255,255,0.5);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}

/* Header */
.live-header{background:#1a1d27;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100}
.live-title{font-size:18px;font-weight:700;color:#fff}
.live-subtitle{font-size:11px;color:var(--txt2);margin-top:1px}
.header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite;flex-shrink:0}
.sync-txt{font-size:11px;color:#4ade80;font-weight:500}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.live-torneo-name{font-size:13px;font-weight:600;color:#4ade80;
  background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.3);
  padding:4px 12px;border-radius:20px;white-space:nowrap;max-width:200px;
  overflow:hidden;text-overflow:ellipsis;display:inline-block}

/* Categoria tabs */
.cat-tabs{display:flex;background:#1a1d27;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
.cat-tab{flex-shrink:0;padding:10px 14px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;color:var(--txt2);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.cat-tab.active-w{color:var(--accent-w);border-bottom-color:var(--accent-w)}
.cat-tab.active-g{color:var(--accent-g);border-bottom-color:var(--accent-g)}
.cat-tab.active-r{color:var(--accent-r);border-bottom-color:var(--accent-r)}
.cat-tab.active-sp{color:#f59e0b;border-bottom-color:#f59e0b}
.cat-tab.active-info{color:#a78bfa;border-bottom-color:#a78bfa}

/* Sub tabs (Classifiche / Partite / Gironi) */
.sub-tabs{display:flex;gap:4px;padding:10px 12px 0;background:#1a1d27;overflow-x:auto;flex-wrap:nowrap}
.sub-tab{flex-shrink:0;padding:6px 14px;border-radius:8px 8px 0 0;font-size:12px;font-weight:600;cursor:pointer;color:var(--txt2);border:1px solid transparent;border-bottom:none;background:rgba(255,255,255,0.04);white-space:nowrap}
.sub-tab.active{background:var(--bg);color:#fff;border-color:var(--border)}

/* Girone sub tabs */
.girone-pills{display:flex;gap:6px;padding:10px 12px;background:#1a1d27;overflow-x:auto;flex-wrap:nowrap;border-bottom:1px solid var(--border)}
.girone-pill{flex-shrink:0;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;color:var(--txt2);border:1px solid var(--border);background:rgba(255,255,255,0.04);white-space:nowrap;transition:all .15s}
.girone-pill.active-w{color:var(--accent-w);border-color:var(--accent-w);background:rgba(74,158,255,0.12)}
.girone-pill.active-g{color:var(--accent-g);border-color:var(--accent-g);background:rgba(74,222,128,0.12)}
.girone-pill.active-r{color:var(--accent-r);border-color:var(--accent-r);background:rgba(248,113,113,0.12)}

/* Content */
.live-body{padding:14px 12px;max-width:900px;margin:0 auto}

/* Girone card */
.girone-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.girone-card-hdr{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.girone-card-hdr.w{background:rgba(74,158,255,0.12);border-bottom:1px solid rgba(74,158,255,0.2)}
.girone-card-hdr.g{background:rgba(74,222,128,0.12);border-bottom:1px solid rgba(74,222,128,0.2)}
.girone-card-hdr.r{background:rgba(248,113,113,0.12);border-bottom:1px solid rgba(248,113,113,0.2)}
.girone-label{font-size:13px;font-weight:700}
.girone-label.w{color:var(--accent-w)}.girone-label.g{color:var(--accent-g)}.girone-label.r{color:var(--accent-r)}
.girone-prog{font-size:11px;color:var(--txt2)}

/* Tables */
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;text-align:left;border-bottom:1px solid var(--border)}
th.r{text-align:right}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px}
td.r{text-align:right}
tr:last-child td{border-bottom:none}
.rank{font-weight:700;width:28px}
.r1{color:#fbbf24}.r2{color:#94a3b8}.r3{color:#cd7c3a}
.team-name{font-weight:600}
.team-soc{font-size:10px;color:var(--txt2);margin-top:1px}
.pts{font-size:16px;font-weight:800}
.pts.w{color:var(--accent-w)}.pts.g{color:var(--accent-g)}.pts.r{color:var(--accent-r)}
.ds-pos{color:#4ade80;font-weight:600}.ds-neg{color:#f87171;font-weight:600}

/* Partite */
.match-item{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.05);gap:8px}
.match-item:last-child{border-bottom:none}
.match-item.played{background:rgba(74,222,128,0.04)}
.match-teams{flex:1;font-size:13px;font-weight:600;color:var(--txt)}
.match-soc{font-size:10px;color:var(--txt2);font-weight:400}
.match-score{font-size:16px;font-weight:800;color:#fff;min-width:60px;text-align:right}
.match-score.w{color:var(--accent-w)}.match-score.g{color:var(--accent-g)}.match-score.r{color:var(--accent-r)}
.match-pending{font-size:11px;color:var(--txt2);min-width:60px;text-align:right}
.leg-badge{font-size:9px;background:rgba(254,249,195,0.15);color:#fde047;padding:1px 5px;border-radius:4px;font-weight:600;white-space:nowrap}

/* Eliminazione */
.elim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:12px}
.elim-match{background:rgba(255,255,255,0.05);border-radius:8px;padding:10px;border:1px solid var(--border)}
.elim-match-title{font-size:10px;color:var(--txt2);font-weight:600;text-transform:uppercase;margin-bottom:6px}
.elim-team-live{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;font-weight:600}
.elim-team-live.win{color:#4ade80}
.elim-team-live.lose{opacity:.4}
.elim-score{font-size:14px;font-weight:800;color:#fff}

/* Podio */
.podium-live{display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap}
.podium-item{text-align:center;padding:10px 14px;border-radius:10px;min-width:90px}
.p1-live{background:linear-gradient(135deg,rgba(251,191,36,.3),rgba(253,224,71,.15));border:1px solid #fbbf24}
.p2-live{background:rgba(148,163,184,.15);border:1px solid #94a3b8}
.p3-live{background:rgba(205,124,58,.15);border:1px solid #cd7c3a}
.podium-trophy{font-size:20px}
.podium-nome-live{font-size:12px;font-weight:700;color:#fff;margin-top:4px}

/* ── SPONSOR PAGE ─────────────────────────────────────── */
.sponsor-page{padding:20px 12px;max-width:900px;margin:0 auto}
.sponsor-cat-section{margin-bottom:32px}
.sponsor-cat-title{font-size:11px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.sponsor-cat-subtitle{font-size:13px;color:var(--txt2);margin:-8px 0 12px;font-style:italic}
.sponsor-grid-lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:16px}
.sponsor-grid-md{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.sponsor-grid-sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.sponsor-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sponsor-card.lg{padding:20px}
.sponsor-card.sm{padding:12px;gap:6px}
.sponsor-img-wrap{display:flex;align-items:center;justify-content:center;width:100%}
.sponsor-img{max-width:100%;border-radius:8px;object-fit:contain}
.sponsor-img.lg{max-height:140px}
.sponsor-img.md{max-height:90px}
.sponsor-img.sm{max-height:60px}
.sponsor-nome{font-size:14px;font-weight:700;color:#fff}
.sponsor-nome.lg{font-size:16px}
.sponsor-nome.sm{font-size:12px}
.sponsor-frase{font-size:12px;color:var(--txt2);line-height:1.5}
.sponsor-frase.lg{font-size:13px}
.sponsor-size-badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:10px;margin-bottom:4px}
.sz-grande{background:rgba(251,191,36,0.15);color:#fbbf24}
.sz-medio{background:rgba(74,222,128,0.15);color:#4ade80}
.sz-piccolo{background:rgba(148,163,184,0.15);color:#94a3b8}

/* ── INFO PAGE ────────────────────────────────────────── */
.info-page{padding:20px 12px;max-width:700px;margin:0 auto}
.info-block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px}
.info-block-title{font-size:15px;font-weight:700;color:#fff;margin-bottom:10px}
.info-block-body{font-size:13px;color:var(--txt2);line-height:1.7;white-space:pre-wrap}
.info-tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;margin-right:6px;margin-bottom:6px}

/* QR panel */
.qr-panel{position:fixed;bottom:20px;right:16px;z-index:500;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.qr-toggle{padding:9px 16px;border:none;border-radius:20px;background:#4ade80;color:#0f1117;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(74,222,128,0.4)}
.qr-box-panel{background:#fff;border-radius:14px;padding:18px;text-align:center;width:240px;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:slideUp .2s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.qr-box-panel h3{font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.qr-box-panel p{font-size:11px;color:#555;margin-bottom:10px}
.qr-url-panel{font-size:9px;color:#888;word-break:break-all;background:#f5f5f5;padding:5px 7px;border-radius:5px}

/* Footer */
.footer-noemi{text-align:center;padding:40px 10px 80px;font-size:.85em;color:var(--footer-text);animation:apparizione 1.5s ease-out}
.link-noemi{color:inherit;text-decoration:none;font-weight:600;border-bottom:1px solid currentColor}
@keyframes apparizione{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.no-data{text-align:center;padding:3rem 1rem;color:var(--txt2)}
</style>
</head>
<body>

<div class="live-header">
  <div>
    <div class="live-title">🏐 Torneo Live</div>
    <div class="live-subtitle" id="liveSubtitle">Caricamento...</div>
  </div>
  <div class="header-right">
    <div style="display:flex;align-items:center;gap:5px">
      <span class="sync-dot" id="syncDot"></span>
      <span class="sync-txt" id="syncTxt">Live</span>
    </div>
    <span class="live-torneo-name" id="torneoSelect"></span>
  </div>
</div>

<!-- Tab categorie + sponsor + info -->
<div class="cat-tabs" id="catTabs"></div>

<!-- Sub tab classifiche/partite (solo per categorie sport) -->
<div id="subTabsWrap">
  <div class="sub-tabs" id="subTabs"></div>
</div>

<!-- Pill selettore girone (solo per classifiche/partite) -->
<div id="gironePillsWrap" style="display:none">
  <div class="girone-pills" id="gironePills"></div>
</div>

<!-- Contenuto principale -->
<div id="liveRoot"><div class="no-data"><p>Connessione...</p></div></div>

<!-- QR Panel -->
<div class="qr-panel">
  <div class="qr-box-panel" id="qrBox" style="display:none">
    <h3>📱 Classifiche Live</h3>
    <p>Scansiona per seguire il torneo</p>
    <div style="display:flex;justify-content:center;margin-bottom:10px"><div id="qrCode"></div></div>
    <div class="qr-url-panel" id="qrUrl"></div>
  </div>
  <button class="qr-toggle" id="qrToggleBtn" onclick="toggleQR()">📱 QR Code</button>
</div>

<!-- Footer -->
<footer class="footer-noemi">
  <p>Progetto e idea di <a href="mailto:tnoemi.marcolini@gmail.com" class="link-noemi">Noemi Marcolini</a></p>
</footer>

<script>
// ── Caricamento dati ──────────────────────────────────────
function loadFromStorage(){
  try{
    const raw=localStorage.getItem('torneo_local');
    if(raw){const data=JSON.parse(raw);if(data&&data.tornei){window._liveDB=data;renderLive();}}
  }catch(e){console.error(e);}
}
setInterval(loadFromStorage,3000);
try{const bc=new BroadcastChannel('torneo_update');bc.onmessage=()=>loadFromStorage();}catch(e){}
window.addEventListener('DOMContentLoaded',()=>loadFromStorage());

// ── Stato ─────────────────────────────────────────────────
let activeTorneoId=null;
let activeCat='white';         // 'white' | 'green' | 'red' | 'sponsor' | 'info'
let activeSub='classifiche';  // 'classifiche' | 'partite'
let activeGirone='all';       // 'all' | girone.id
let DB={tornei:{}};

function setSyncStatus(){
  const d=document.getElementById('syncDot');
  const t=document.getElementById('syncTxt');
  if(d)d.style.background='#4ade80';
  if(t)t.textContent='Live · '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}

function setCatLive(cat){
  activeCat=cat;
  activeGirone='all';
  // Se cambia categoria sportiva, rimetti classifiche
  if(['white','green','red'].includes(cat)) activeSub='classifiche';
  renderLive();
}
function setSubLive(sub){activeSub=sub;activeGirone='all';renderLive();}
function setGironeLive(gid){activeGirone=gid;renderContent();}

// ── Calcoli ───────────────────────────────────────────────
function calcCl(g){
  const t=g.squadre.map((s,i)=>({i,nome:s.nome,soc:s.soc||'',pt:0,sv:0,sp:0,pv:0,pp:0}));
  for(const p of g.partite){
    if(p.s1h===''||p.s1a==='')continue;
    const s1h=parseInt(p.s1h)||0,s1a=parseInt(p.s1a)||0;
    const sets=p.sets||g.sets||2;const has2=sets===2&&p.s2h!=='';
    const s2h=has2?parseInt(p.s2h)||0:0,s2a=has2?parseInt(p.s2a)||0:0;
    const sh=(s1h>s1a?1:0)+(has2&&s2h>s2a?1:0);const sa=(s1a>s1h?1:0)+(has2&&s2a>s2h?1:0);
    t[p.h].pt+=sh;t[p.a].pt+=sa;t[p.h].sv+=sh;t[p.a].sv+=sa;t[p.h].sp+=sa;t[p.a].sp+=sh;
    t[p.h].pv+=s1h+(has2?s2h:0);t[p.a].pv+=s1a+(has2?s2a:0);
    t[p.h].pp+=s1a+(has2?s2a:0);t[p.a].pp+=s1h+(has2?s2h:0);
  }
  t.forEach(x=>{x.ds=x.sv-x.sp;x.dp=x.pv-x.pp});
  t.sort((a,b)=>b.pt-a.pt||b.ds-a.ds||b.dp-a.dp);
  return t;
}
function getWinner(m){if(!m||m.s1h===''||m.s1a==='')return null;return(parseInt(m.s1h)||0)>(parseInt(m.s1a)||0)?m.t1:m.t2;}
function getLoser(m){if(!m||m.s1h===''||m.s1a==='')return null;return(parseInt(m.s1h)||0)<=(parseInt(m.s1a)||0)?m.t1:m.t2;}

// ── Render principale ─────────────────────────────────────
function renderLive(){
  if(!window._liveDB)return;
  DB=window._liveDB;
  setSyncStatus();
  const tornei=DB.tornei||{};

  const liveId=localStorage.getItem('torneo_live_id');
  if(liveId&&tornei[liveId]) activeTorneoId=liveId;
  else{
    const ids=Object.keys(tornei).sort((a,b)=>(tornei[b].createdAt||0)-(tornei[a].createdAt||0));
    activeTorneoId=ids[0]||null;
  }

  const nameEl=document.getElementById('torneoSelect');
  if(nameEl&&activeTorneoId&&tornei[activeTorneoId]) nameEl.textContent=tornei[activeTorneoId].nome;

  if(!activeTorneoId||!tornei[activeTorneoId]){
    document.getElementById('liveRoot').innerHTML='<div class="no-data"><p>Nessun torneo in corso.<br>Impostalo dall\'app di gestione.</p></div>';
    return;
  }

  const torneo=tornei[activeTorneoId];
  document.getElementById('liveSubtitle').textContent=torneo.nome;
  document.title=torneo.nome+' — Live';

  // ── Tab categorie sportive
  const sportCats=[
    {k:'white',label:'⬜ White',ac:'active-w'},
    {k:'green', label:'🟩 Green', ac:'active-g'},
    {k:'red',   label:'🟥 Red',   ac:'active-r'},
  ].filter(c=>(torneo.cats?.[c.k]?.fasi||[]).some(f=>f.gironi?.length||f.tipo==='elim'));

  // ── Tab extra (sponsor / info)
  const hasSponsor=torneo.pageConfig?.sponsorEnabled&&(torneo.pageConfig?.sponsor?.cats||[]).some(c=>c.items?.length);
  const hasInfo=torneo.pageConfig?.infoEnabled&&torneo.pageConfig?.infoBlocks?.some(b=>b.titolo||b.testo);

  const allTabs=[...sportCats];
  if(hasSponsor) allTabs.push({k:'sponsor',label:'🤝 Sponsor',ac:'active-sp'});
  if(hasInfo)    allTabs.push({k:'info',label:'ℹ️ Info',ac:'active-info'});

  // Se la categoria attiva non è più disponibile, torna alla prima
  if(!allTabs.find(t=>t.k===activeCat)) activeCat=allTabs[0]?.k||'white';

  const isSportCat=['white','green','red'].includes(activeCat);

  document.getElementById('catTabs').innerHTML=allTabs.map(c=>`
    <div class="cat-tab${activeCat===c.k?' '+c.ac:''}" onclick="setCatLive('${c.k}')">${c.label}</div>
  `).join('');

  // Sub tabs (solo per categorie sportive)
  const subWrap=document.getElementById('subTabsWrap');
  if(isSportCat){
    subWrap.style.display='';
    document.getElementById('subTabs').innerHTML=`
      <div class="sub-tab${activeSub==='classifiche'?' active':''}" onclick="setSubLive('classifiche')">📊 Classifiche</div>
      <div class="sub-tab${activeSub==='partite'?' active':''}" onclick="setSubLive('partite')">📋 Partite</div>
    `;
  } else {
    subWrap.style.display='none';
  }

  renderContent();
}

function renderContent(){
  const torneo=DB.tornei[activeTorneoId];
  if(!torneo)return;

  // ── Pagina sponsor
  if(activeCat==='sponsor'){
    document.getElementById('gironePillsWrap').style.display='none';
    document.getElementById('liveRoot').innerHTML=renderSponsorPage(torneo);
    return;
  }

  // ── Pagina info
  if(activeCat==='info'){
    document.getElementById('gironePillsWrap').style.display='none';
    document.getElementById('liveRoot').innerHTML=renderInfoPage(torneo);
    return;
  }

  // ── Categoria sportiva
  const fasi=(torneo.cats?.[activeCat]?.fasi)||[];
  const cat=activeCat;
  const cc=cat==='white'?'w':cat==='green'?'g':'r';

  // Raccoglie tutti i gironi (non elim) per i pill
  const tuttiGironi=[];
  for(const fase of fasi){
    if(fase.tipo!=='elim'){
      for(const g of(fase.gironi||[])){
        tuttiGironi.push({id:g.id,label:`${fase.label} — Girone ${g.label}`,fase,g});
      }
    }
  }

  // Pill selettore girone
  const pillsWrap=document.getElementById('gironePillsWrap');
  const pillsEl=document.getElementById('gironePills');
  if(tuttiGironi.length>1){
    pillsWrap.style.display='';
    // verifica che activeGirone sia ancora valido
    if(activeGirone!=='all'&&!tuttiGironi.find(x=>x.id===activeGirone)) activeGirone='all';
    pillsEl.innerHTML=`<div class="girone-pill${activeGirone==='all'?' active-'+cc:''}" onclick="setGironeLive('all')">Tutti</div>`
      +tuttiGironi.map(x=>`<div class="girone-pill${activeGirone===x.id?' active-'+cc:''}" onclick="setGironeLive('${x.id}')">${x.label}</div>`).join('');
  } else {
    pillsWrap.style.display='none';
    activeGirone='all';
  }

  let html='<div class="live-body">';

  for(const fase of fasi){
    if(fase.tipo==='elim'){
      // Elim: mostra sempre (non filtrabile per girone)
      html+=renderElimLive(fase,cc);
    } else {
      const gironiDaMostrare=(activeGirone==='all')
        ?(fase.gironi||[])
        :(fase.gironi||[]).filter(g=>g.id===activeGirone);

      for(const g of gironiDaMostrare){
        html+=`<div class="girone-card">
          <div class="girone-card-hdr ${cc}">
            <span class="girone-label ${cc}">${fase.label} — Girone ${g.label}</span>
            <span class="girone-prog">${g.partite.filter(p=>p.s1h!=='').length}/${g.partite.length} partite</span>
          </div>`;
        if(activeSub==='classifiche') html+=renderClassificaLive(g,cc);
        else                          html+=renderPartiteLive(g,cc);
        html+=`</div>`;
      }
    }
  }

  html+='</div>';
  document.getElementById('liveRoot').innerHTML=html;
}

// ── Classifica ─────────────────────────────────────────────
function renderClassificaLive(g,cc){
  const cl=calcCl(g);const sets=g.sets||2;
  let h=`<table><thead><tr>
    <th>#</th><th>Squadra</th><th class="r">Pt</th>
    ${sets===2?'<th class="r">DS</th>':''}
    <th class="r">DP</th>
  </tr></thead><tbody>`;
  cl.forEach((t,i)=>{
    const ri=i===0?'r1':i===1?'r2':i===2?'r3':'';
    h+=`<tr>
      <td class="rank ${ri}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td>
      <td><div class="team-name">${t.nome}</div>${t.soc?`<div class="team-soc">${t.soc}</div>`:''}</td>
      <td class="r"><span class="pts ${cc}">${t.pt}</span></td>
      ${sets===2?`<td class="r"><span class="${t.ds>0?'ds-pos':t.ds<0?'ds-neg':''}">${t.ds>0?'+':''}${t.ds}</span></td>`:''}
      <td class="r" style="color:var(--txt2);font-size:12px">${t.dp>0?'+':''}${t.dp}</td>
    </tr>`;
  });
  return h+`</tbody></table>`;
}

// ── Partite ────────────────────────────────────────────────
function renderPartiteLive(g,cc){
  const sets=g.sets||2;
  const andata=g.partite.filter(p=>!p.leg||p.leg===1);
  const ritorno=g.partite.filter(p=>p.leg===2);

  function partiteHtml(pList){
    return pList.map(p=>{
      const hn=g.squadre[p.h].nome,an=g.squadre[p.a].nome;
      const hs=g.squadre[p.h].soc||'',as=g.squadre[p.a].soc||'';
      const played=p.s1h!==''&&p.s1a!=='';
      let score='';
      if(played){
        score=`${p.s1h}–${p.s1a}`;
        if(sets===2&&p.s2h!=='')score+=` / ${p.s2h}–${p.s2a}`;
      }
      return`<div class="match-item${played?' played':''}">
        <div class="match-teams">
          <div>${hn}${hs?` <span class="match-soc">(${hs})</span>`:''}</div>
          <div style="color:var(--txt2);font-size:11px;margin:2px 0">vs</div>
          <div>${an}${as?` <span class="match-soc">(${as})</span>`:''}</div>
        </div>
        ${p.leg===2?`<span class="leg-badge">RIT</span>`:''}
        ${played
          ?`<div class="match-score ${cc}">${score}</div>`
          :`<div class="match-pending">da giocare</div>`
        }
      </div>`;
    }).join('');
  }

  let h=partiteHtml(andata);
  if(ritorno.length) h+=`<div style="font-size:10px;font-weight:600;color:var(--txt2);text-transform:uppercase;padding:8px 14px 4px;border-top:1px solid var(--border)">Ritorno</div>`+partiteHtml(ritorno);
  return h;
}

// ── Eliminazione ───────────────────────────────────────────
function renderElimLive(fase,cc){
  const e=fase.elim||{};
  const hasQ=e.q1||e.q2||e.q3||e.q4;
  const wFin=getWinner(e.fin12),lFin=getLoser(e.fin12),wFin34=getWinner(e.fin34);

  let html=`<div class="girone-card">
    <div class="girone-card-hdr ${cc}">
      <span class="girone-label ${cc}">⚡ ${fase.label}</span>
    </div>`;

  if(wFin){
    html+=`<div class="podium-live">
      <div class="podium-item p2-live"><div class="podium-trophy">🥈</div><div class="podium-nome-live">${lFin||'—'}</div></div>
      <div class="podium-item p1-live"><div class="podium-trophy">🥇</div><div class="podium-nome-live">${wFin}</div></div>
      <div class="podium-item p3-live"><div class="podium-trophy">🥉</div><div class="podium-nome-live">${wFin34||'—'}</div></div>
    </div>`;
  }

  function elimMatch(m,title){
    if(!m)return'';
    const w=getWinner(m);const played=m.s1h!==''&&m.s1a!=='';
    return`<div class="elim-match">
      <div class="elim-match-title">${title}</div>
      <div class="elim-team-live${w===m.t1?' win':played?' lose':''}">
        <span>${m.t1||'—'}</span>${played?`<span class="elim-score">${m.s1h}</span>`:''}
      </div>
      <div class="elim-team-live${w===m.t2?' win':played?' lose':''}">
        <span>${m.t2||'—'}</span>${played?`<span class="elim-score">${m.s1a}</span>`:''}
      </div>
    </div>`;
  }

  html+=`<div class="elim-grid">`;
  if(hasQ){
    ['q1','q2','q3','q4'].filter(k=>e[k]).forEach((k,i)=>{
      html+=elimMatch(e[k],`Quarto ${i+1}: ${['1°vs8°','2°vs7°','3°vs6°','4°vs5°'][i]}`);
    });
  }
  if(e.sf1)html+=elimMatch(e.sf1,'Semifinale 1');
  if(e.sf2)html+=elimMatch(e.sf2,'Semifinale 2');
  if(e.fin12)html+=elimMatch(e.fin12,'🏆 Finale 1°-2°');
  if(e.fin34&&e.fin34.t1&&e.fin34.t2)html+=elimMatch(e.fin34,'Finale 3°-4°');
  html+=`</div></div>`;
  return html;
}

// ── Pagina Sponsor ─────────────────────────────────────────
function renderSponsorPage(torneo){
  const cfg=torneo.pageConfig||{};
  const cats=cfg.sponsor?.cats||[];
  if(!cats.length) return`<div class="no-data"><p>Nessuno sponsor configurato.</p></div>`;

  let html='<div class="sponsor-page">';
  for(const cat of cats){
    const items=cat.items||[];
    if(!items.length) continue;

    const grandi=items.filter(x=>x.size==='grande');
    const medi  =items.filter(x=>x.size==='medio');
    const piccoli=items.filter(x=>x.size==='piccolo');

    html+=`<div class="sponsor-cat-section">`;
    if(cat.nome) html+=`<div class="sponsor-cat-title">${cat.nome}</div>`;

    function sponsorCard(sp,sz){
      const gridClass=sz==='grande'?'lg':sz==='medio'?'md':'sm';
      const imgClass=sz==='grande'?'lg':sz==='medio'?'md':'sm';
      let card=`<div class="sponsor-card ${gridClass}">`;
      if(sp.immagine) card+=`<div class="sponsor-img-wrap"><img class="sponsor-img ${imgClass}" src="${sp.immagine}" alt="${sp.nome||''}"></div>`;
      if(sp.nome) card+=`<div class="sponsor-nome ${gridClass}">${sp.nome}</div>`;
      if(sp.frase) card+=`<div class="sponsor-frase ${gridClass}">${sp.frase}</div>`;
      card+=`</div>`;
      return card;
    }

    if(grandi.length){
      html+=`<div class="sponsor-grid-lg">${grandi.map(sp=>sponsorCard(sp,'grande')).join('')}</div>`;
    }
    if(medi.length){
      html+=`<div class="sponsor-grid-md">${medi.map(sp=>sponsorCard(sp,'medio')).join('')}</div>`;
    }
    if(piccoli.length){
      html+=`<div class="sponsor-grid-sm">${piccoli.map(sp=>sponsorCard(sp,'piccolo')).join('')}</div>`;
    }
    html+=`</div>`;
  }
  html+=`</div>`;
  return html;
}

// ── Pagina Info ────────────────────────────────────────────
function renderInfoPage(torneo){
  const cfg=torneo.pageConfig||{};
  const blocks=cfg.infoBlocks||[];
  if(!blocks.length) return`<div class="no-data"><p>Nessuna informazione disponibile.</p></div>`;

  let html='<div class="info-page">';
  for(const b of blocks){
    if(!b.titolo&&!b.testo) continue;
    html+=`<div class="info-block">`;
    if(b.titolo) html+=`<div class="info-block-title">${b.titolo}</div>`;
    if(b.testo)  html+=`<div class="info-block-body">${escHtml(b.testo)}</div>`;
    html+=`</div>`;
  }
  html+=`</div>`;
  return html;
}

function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── QR Code ───────────────────────────────────────────────
let qrOpen=false,qrGenerated=false;
function toggleQR(){
  qrOpen=!qrOpen;
  const box=document.getElementById('qrBox');
  const btn=document.getElementById('qrToggleBtn');
  if(!box)return;
  if(qrOpen){
    const url=window.location.href.split('?')[0];
    document.getElementById('qrUrl').textContent=url;
    if(!qrGenerated){
      const wrap=document.getElementById('qrCode');
      wrap.innerHTML='';
      new QRCode(wrap,{text:url,width:160,height:160,colorDark:'#1a1a1a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
      qrGenerated=true;
    }
    box.style.display='block';
    if(btn)btn.textContent='✕ Chiudi QR';
  } else {
    box.style.display='none';
    if(btn)btn.textContent='📱 QR Code';
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&qrOpen)toggleQR();});
</script>
