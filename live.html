<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneo Pallavolo — Live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:rgba(255,255,255,0.10);--txt:#f0f0f0;--txt2:#888;--footer-text:rgba(255,255,255,0.5);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}

/* Header */
.live-header{background:#1a1d27;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100}
.live-title{font-size:18px;font-weight:700}
.live-subtitle{font-size:11px;color:var(--txt2);margin-top:1px}
.header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite;flex-shrink:0}
.sync-txt{font-size:11px;color:#4ade80;font-weight:500}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.live-torneo-name{font-size:13px;font-weight:600;color:#4ade80;background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.3);padding:4px 12px;border-radius:20px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;display:inline-block}

/* Tab bar */
.cat-tabs{display:flex;background:#1a1d27;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
.cat-tab{flex-shrink:0;padding:10px 14px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;color:var(--txt2);border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s}
.cat-tab.active{color:#fff}

/* Sub tabs */
.sub-tabs{display:flex;gap:4px;padding:10px 12px 0;background:#1a1d27;overflow-x:auto;flex-wrap:nowrap}
.sub-tab{flex-shrink:0;padding:6px 14px;border-radius:8px 8px 0 0;font-size:12px;font-weight:600;cursor:pointer;color:var(--txt2);border:1px solid transparent;border-bottom:none;background:rgba(255,255,255,0.04);white-space:nowrap}
.sub-tab.active{background:var(--bg);color:#fff;border-color:var(--border)}

/* Girone pills */
.girone-pills{display:flex;gap:6px;padding:10px 12px;background:#1a1d27;overflow-x:auto;flex-wrap:nowrap;border-bottom:1px solid var(--border)}
.girone-pill{flex-shrink:0;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;color:var(--txt2);border:1px solid var(--border);background:rgba(255,255,255,0.04);white-space:nowrap;transition:all .15s}

/* Ricerca */
.search-bar{padding:10px 12px;background:#1a1d27;border-bottom:1px solid var(--border)}
.search-input{width:100%;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,0.07);color:#fff;font-size:14px;outline:none}
.search-input::placeholder{color:var(--txt2)}
.search-input:focus{border-color:rgba(255,255,255,0.3)}

/* Content */
.live-body{padding:14px 12px;max-width:900px;margin:0 auto}

/* Girone card */
.girone-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.girone-card-hdr{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}

/* Tables */
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;text-align:left;border-bottom:1px solid var(--border)}
th.r{text-align:right}td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px}td.r{text-align:right}
tr:last-child td{border-bottom:none}
.rank{font-weight:700;width:28px}
.r1{color:#fbbf24}.r2{color:#94a3b8}.r3{color:#cd7c3a}
.team-name{font-weight:600}.team-soc{font-size:10px;color:var(--txt2);margin-top:1px}
.pts{font-size:16px;font-weight:800}
.ds-pos{color:#4ade80;font-weight:600}.ds-neg{color:#f87171;font-weight:600}

/* Partite */
.match-item{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.05);gap:8px}
.match-item:last-child{border-bottom:none}
.match-item.played{background:rgba(74,222,128,0.04)}
.match-item.fav-highlight{background:rgba(251,191,36,0.08);border-left:3px solid #fbbf24}
.match-teams-live{flex:1;font-size:13px;font-weight:600}
.match-soc-live{font-size:10px;color:var(--txt2);font-weight:400}
.match-score-live{font-size:16px;font-weight:800;min-width:60px;text-align:right}
.match-pending{font-size:11px;color:var(--txt2);min-width:60px;text-align:right}

/* Preferiti star */
.fav-star{cursor:pointer;font-size:16px;flex-shrink:0;opacity:.4;transition:opacity .15s;background:none;border:none;padding:0 4px}
.fav-star.active{opacity:1}

/* Elim */
.elim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:12px}
.elim-match{background:rgba(255,255,255,0.05);border-radius:8px;padding:10px;border:1px solid var(--border)}
.elim-match-title{font-size:10px;color:var(--txt2);font-weight:600;text-transform:uppercase;margin-bottom:6px}
.elim-team-live{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;font-weight:600}
.elim-team-live.win{color:#4ade80}.elim-team-live.lose{opacity:.4}
.elim-score{font-size:14px;font-weight:800}

/* Podio */
.podium-live{display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap}
.podium-item{text-align:center;padding:10px 14px;border-radius:10px;min-width:90px}
.p1-live{background:linear-gradient(135deg,rgba(251,191,36,.3),rgba(253,224,71,.15));border:1px solid #fbbf24}
.p2-live{background:rgba(148,163,184,.15);border:1px solid #94a3b8}
.p3-live{background:rgba(205,124,58,.15);border:1px solid #cd7c3a}
.podium-nome-live{font-size:12px;font-weight:700;margin-top:4px}

/* Sponsor */
.sponsor-page{padding:20px 12px;max-width:900px;margin:0 auto}
.sponsor-cat-section{margin-bottom:32px}
.sponsor-cat-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;padding:6px 10px;border-radius:6px;background:rgba(245,158,11,0.15);color:#f59e0b;border-left:3px solid #f59e0b}
.sponsor-grid-lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:16px}
.sponsor-grid-md{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.sponsor-grid-sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.sponsor-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sponsor-card.lg{padding:20px}.sponsor-card.sm{padding:12px;gap:6px}
.sponsor-img{max-width:100%;border-radius:8px;object-fit:contain}
.sponsor-img.lg{max-height:140px}.sponsor-img.md{max-height:90px}.sponsor-img.sm{max-height:60px}
.sponsor-nome{font-size:14px;font-weight:700}.sponsor-nome.lg{font-size:16px}.sponsor-nome.sm{font-size:12px}
.sponsor-frase{font-size:12px;color:var(--txt2);line-height:1.5}.sponsor-frase.lg{font-size:13px}

/* Info */
.info-page{padding:20px 12px;max-width:700px;margin:0 auto}
.info-block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px}
.info-block-title{font-size:15px;font-weight:700;margin-bottom:10px}
.info-block-body{font-size:13px;color:var(--txt2);line-height:1.7;white-space:pre-wrap}

/* Menu */
.menu-page{padding:20px 12px;max-width:700px;margin:0 auto}
.menu-sezione{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px}
.menu-sezione-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;padding:6px 10px;border-radius:6px;background:rgba(167,139,250,0.18);color:#a78bfa;border-left:3px solid #a78bfa}
.menu-voce{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);gap:12px}
.menu-voce:last-child{border-bottom:none}
.menu-voce-nome{font-size:14px;font-weight:600}
.menu-voce-desc{font-size:12px;color:var(--txt2);margin-top:3px}
.menu-voce-prezzo{font-size:16px;font-weight:800;color:#4ade80;white-space:nowrap;flex-shrink:0}
.menu-note{background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);border-radius:10px;padding:14px;margin-bottom:14px;font-size:13px;color:#fde047;line-height:1.6}

/* Mia giornata */
.giornata-page{padding:14px 12px;max-width:900px;margin:0 auto}
.giornata-empty{text-align:center;padding:3rem 1rem;color:var(--txt2)}
.giornata-cat-section{margin-bottom:20px}
.giornata-cat-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;border-radius:8px;margin-bottom:10px;display:inline-block}

/* QR */
.qr-panel{position:fixed;bottom:20px;right:16px;z-index:500;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.qr-toggle{padding:9px 16px;border:none;border-radius:20px;background:#4ade80;color:#0f1117;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(74,222,128,0.4)}
.qr-box-panel{background:#fff;border-radius:14px;padding:18px;text-align:center;width:240px;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:slideUp .2s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.qr-box-panel h3{font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.qr-box-panel p{font-size:11px;color:#555;margin-bottom:10px}
.qr-url-panel{font-size:9px;color:#888;word-break:break-all;background:#f5f5f5;padding:5px 7px;border-radius:5px}

.footer-noemi{text-align:center;padding:40px 10px 100px;font-size:.85em;color:var(--footer-text)}
.link-noemi{color:inherit;text-decoration:none;font-weight:600;border-bottom:1px solid currentColor}
.no-data{text-align:center;padding:3rem 1rem;color:var(--txt2)}
</style>
</head>
<body>
<div class="live-header">
  <div>
    <div class="live-title">🏐 Torneo Live</div>
    <div class="live-subtitle" id="liveSubtitle">Caricamento...</div>
  </div>
  <div class="header-right">
    <div style="display:flex;align-items:center;gap:5px">
      <span class="sync-dot"></span>
      <span class="sync-txt" id="syncTxt">Live</span>
    </div>
    <span class="live-torneo-name" id="torneoName"></span>
  </div>
</div>

<div class="cat-tabs" id="catTabs"></div>
<div id="subTabsWrap"><div class="sub-tabs" id="subTabs"></div></div>
<div id="gironePillsWrap" style="display:none"><div class="girone-pills" id="gironePills"></div></div>
<div id="searchBarWrap" style="display:none"><div class="search-bar"><input class="search-input" id="searchInput" placeholder="🔍 Cerca squadra..." oninput="onSearch(this.value)"></div></div>
<div id="liveRoot"><div class="no-data"><p>Connessione...</p></div></div>

<div class="qr-panel">
  <div class="qr-box-panel" id="qrBox" style="display:none">
    <h3>📱 Classifiche Live</h3>
    <p>Scansiona per seguire il torneo</p>
    <div style="display:flex;justify-content:center;margin-bottom:10px"><div id="qrCode"></div></div>
    <div class="qr-url-panel" id="qrUrl"></div>
  </div>
  <button class="qr-toggle" id="qrToggleBtn" onclick="toggleQR()">📱 QR</button>
</div>

<footer class="footer-noemi">
  <p>Progetto e idea di <a href="mailto:tnoemi.marcolini@gmail.com" class="link-noemi">Noemi Marcolini</a></p>
</footer>

<script>
// ── Preferiti (localStorage del telefono del pubblico) ─────
let FAVS=new Set(JSON.parse(localStorage.getItem('live_favs')||'[]'));
function saveFavs(){localStorage.setItem('live_favs',JSON.stringify([...FAVS]));}
function toggleFav(nome){if(FAVS.has(nome))FAVS.delete(nome);else FAVS.add(nome);saveFavs();renderContent();}
function isFav(nome){return FAVS.has(nome);}

// ── Caricamento dati ───────────────────────────────────────
function loadFromStorage(){
  try{
    const raw=localStorage.getItem('torneo_local');
    if(raw){const d=JSON.parse(raw);if(d&&d.tornei){window._liveDB=d;renderLive();}}
  }catch(e){console.error('loadFromStorage:',e);}
}
setInterval(loadFromStorage,3000);
try{new BroadcastChannel('torneo_update').onmessage=()=>loadFromStorage();}catch(e){}
window.addEventListener('DOMContentLoaded',()=>loadFromStorage());

// ── Stato ─────────────────────────────────────────────────
let activeTorneoId=null;
let activeCat=null;   // catId | 'sponsor' | 'info' | 'menu' | 'giornata'
let activeSub='classifiche';
let activeGirone='all';
let searchQuery='';
let DB={tornei:{}};

// ── Migrazione torneo: vecchio cats{} → categorie[] ────────
function migrateTorneo(t){
  if(t.categorie)return t;
  t.categorie=[];
  const oldMap={white:{nome:'White',colore:'#1e40af',emoji:'⬜'},green:{nome:'Green',colore:'#166534',emoji:'🟩'},red:{nome:'Red',colore:'#991b1b',emoji:'🟥'}};
  for(const[id,meta]of Object.entries(oldMap)){
    const fasi=t.cats?.[id]?.fasi||[];
    if(fasi.length||Object.keys(t.cats||{}).includes(id))
      t.categorie.push({id,nome:meta.nome,colore:meta.colore,emoji:meta.emoji,fasi});
  }
  return t;
}

function setSyncStatus(){const t=document.getElementById('syncTxt');if(t)t.textContent='Live · '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});}
function setCatLive(cat){activeCat=cat;activeGirone='all';searchQuery='';if(['sponsor','info','menu','giornata'].includes(cat))activeSub='classifiche';renderLive();}
function setSubLive(sub){activeSub=sub;activeGirone='all';searchQuery='';renderLive();}
function setGironeLive(gid){activeGirone=gid;renderContent();}
function onSearch(q){searchQuery=q;renderContent();}

// ── Calcoli ────────────────────────────────────────────────
function calcCl(g){
  const t=g.squadre.map((s,i)=>({i,nome:s.nome,soc:s.soc||'',pt:0,sv:0,sp:0,pv:0,pp:0}));
  for(const p of g.partite){
    if(p.s1h===''||p.s1a==='')continue;
    const s1h=parseInt(p.s1h)||0,s1a=parseInt(p.s1a)||0;
    const sets=p.sets||g.sets||2;const has2=sets===2&&p.s2h!=='';
    const s2h=has2?parseInt(p.s2h)||0:0,s2a=has2?parseInt(p.s2a)||0:0;
    const sh=(s1h>s1a?1:0)+(has2&&s2h>s2a?1:0),sa=(s1a>s1h?1:0)+(has2&&s2a>s2h?1:0);
    t[p.h].pt+=sh;t[p.a].pt+=sa;t[p.h].sv+=sh;t[p.a].sv+=sa;t[p.h].sp+=sa;t[p.a].sp+=sh;
    t[p.h].pv+=s1h+(has2?s2h:0);t[p.a].pv+=s1a+(has2?s2a:0);t[p.h].pp+=s1a+(has2?s2a:0);t[p.a].pp+=s1h+(has2?s2h:0);
  }
  t.forEach(x=>{x.ds=x.sv-x.sp;x.dp=x.pv-x.pp});
  t.sort((a,b)=>b.pt-a.pt||b.ds-a.ds||b.dp-a.dp);
  return t;
}
function getWinner(m){if(!m||m.s1h===''||m.s1a==='')return null;return(parseInt(m.s1h)||0)>(parseInt(m.s1a)||0)?m.t1:m.t2;}
function getLoser(m){if(!m||m.s1h===''||m.s1a==='')return null;return(parseInt(m.s1h)||0)<=(parseInt(m.s1a)||0)?m.t1:m.t2;}
function hexRgb(hex){try{return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}catch(e){return[100,100,100];}}

// ── Render principale ──────────────────────────────────────
function renderLive(){
  if(!window._liveDB)return;
  DB=window._liveDB;setSyncStatus();
  const tornei=DB.tornei||{};
  const liveId=localStorage.getItem('torneo_live_id');
  if(liveId&&tornei[liveId])activeTorneoId=liveId;
  else{const ids=Object.keys(tornei).sort((a,b)=>(tornei[b].createdAt||0)-(tornei[a].createdAt||0));activeTorneoId=ids[0]||null;}
  if(!activeTorneoId||!tornei[activeTorneoId]){document.getElementById('liveRoot').innerHTML='<div class="no-data"><p>Nessun torneo in corso.</p></div>';return;}
  const torneo=migrateTorneo(tornei[activeTorneoId]);
  document.getElementById('torneoName').textContent=torneo.nome;
  document.getElementById('liveSubtitle').textContent=torneo.nome;
  document.title=torneo.nome+' — Live';

  const cats=(torneo.categorie||[]).filter(c=>(c.fasi||[]).some(f=>f.gironi?.length||f.tipo==='elim'));
  const cfg=torneo.pageConfig||{};
  // Mostra la tab se il toggle è attivo (indipendentemente dal contenuto)
  const hasSponsor=cfg.sponsorEnabled&&(cfg.sponsor?.cats||[]).length>0;
  const hasInfo=cfg.infoEnabled;
  const hasMenu=cfg.menuEnabled;
  const hasFavs=FAVS.size>0;

  const allTabs=[...cats.map(c=>({k:c.id,label:`${c.emoji} ${c.nome}`,col:c.colore,isSport:true}))];
  if(hasFavs)allTabs.push({k:'giornata',label:'⭐ La mia giornata',col:'#fbbf24',isSport:false});
  if(hasSponsor)allTabs.push({k:'sponsor',label:'🤝 Sponsor',col:'#f59e0b',isSport:false});
  if(hasMenu)allTabs.push({k:'menu',label:'🍽️ Menu',col:'#a78bfa',isSport:false});
  if(hasInfo)allTabs.push({k:'info',label:'ℹ️ Info',col:'#60a5fa',isSport:false});

  if(!activeCat||!allTabs.find(t=>t.k===activeCat))activeCat=allTabs[0]?.k||null;
  const activeTab=allTabs.find(t=>t.k===activeCat);
  const isSport=activeTab?.isSport??false;

  document.getElementById('catTabs').innerHTML=allTabs.map(tab=>{
    const isAct=activeCat===tab.k;
    return`<div class="cat-tab${isAct?' active':''}" style="${isAct?`border-bottom-color:${tab.col};color:${tab.col}`:''}" onclick="setCatLive('${tab.k}')">${tab.label}</div>`;
  }).join('');

  // Sub tabs (solo per categorie sportive)
  const subWrap=document.getElementById('subTabsWrap');
  if(isSport){
    subWrap.style.display='';
    document.getElementById('subTabs').innerHTML=`
      <div class="sub-tab${activeSub==='classifiche'?' active':''}" onclick="setSubLive('classifiche')">📊 Classifiche</div>
      <div class="sub-tab${activeSub==='partite'?' active':''}" onclick="setSubLive('partite')">📋 Partite</div>`;
  } else {subWrap.style.display='none';}

  // Search bar (solo partite)
  const searchWrap=document.getElementById('searchBarWrap');
  if(isSport&&activeSub==='partite'){searchWrap.style.display='';}else{searchWrap.style.display='none';searchQuery='';}

  renderContent();
}

function renderContent(){
  const torneo=DB.tornei?.[activeTorneoId];if(!torneo)return;
  const cfg=torneo.pageConfig||{};
  if(activeCat==='sponsor'){document.getElementById('gironePillsWrap').style.display='none';document.getElementById('liveRoot').innerHTML=renderSponsorPage(cfg);return;}
  if(activeCat==='info'){document.getElementById('gironePillsWrap').style.display='none';document.getElementById('liveRoot').innerHTML=renderInfoPage(cfg);return;}
  if(activeCat==='menu'){document.getElementById('gironePillsWrap').style.display='none';document.getElementById('liveRoot').innerHTML=renderMenuPage(cfg);return;}
  if(activeCat==='giornata'){document.getElementById('gironePillsWrap').style.display='none';document.getElementById('liveRoot').innerHTML=renderGiornataPage(torneo);return;}

  const cat=(torneo.categorie||[]).find(c=>c.id===activeCat);
  if(!cat){document.getElementById('liveRoot').innerHTML='<div class="no-data">Categoria non trovata.</div>';return;}
  const col=cat.colore;const fasi=cat.fasi||[];

  // Pill gironi
  const tuttiGironi=[];
  for(const fase of fasi){if(fase.tipo!=='elim'){for(const g of(fase.gironi||[])){tuttiGironi.push({id:g.id,label:`${fase.label} — Girone ${g.label}`,fase,g});}}}
  const pillsWrap=document.getElementById('gironePillsWrap');const pillsEl=document.getElementById('gironePills');
  if(tuttiGironi.length>1){
    pillsWrap.style.display='';
    if(activeGirone!=='all'&&!tuttiGironi.find(x=>x.id===activeGirone))activeGirone='all';
    pillsEl.innerHTML=`<div class="girone-pill${activeGirone==='all'?'" style="color:'+col+';border-color:'+col+';background:'+col+'22':'"'} onclick="setGironeLive('all')">Tutti</div>`
      +tuttiGironi.map(x=>`<div class="girone-pill${activeGirone===x.id?'" style="color:'+col+';border-color:'+col+';background:'+col+'22':'"'} onclick="setGironeLive('${x.id}')">${x.label}</div>`).join('');
  } else {pillsWrap.style.display='none';activeGirone='all';}

  let html='<div class="live-body">';
  for(const fase of fasi){
    if(fase.tipo==='elim'){html+=renderElimLive(fase,cat);continue;}
    const gironiDaMostrare=activeGirone==='all'?(fase.gironi||[]):(fase.gironi||[]).filter(g=>g.id===activeGirone);
    for(const g of gironiDaMostrare){
      html+=`<div class="girone-card">
        <div class="girone-card-hdr" style="background:${col}18;border-bottom-color:${col}33">
          <span style="font-size:13px;font-weight:700;color:${col}">${fase.label} — Girone ${g.label}</span>
          <span style="font-size:11px;color:var(--txt2)">${g.partite.filter(p=>p.s1h!=='').length}/${g.partite.length} partite</span>
        </div>`;
      if(activeSub==='classifiche')html+=renderClassificaLive(g,col);
      else html+=renderPartiteLive(g,col);
      html+=`</div>`;
    }
  }
  html+='</div>';
  document.getElementById('liveRoot').innerHTML=html;
}

// ── Classifica ─────────────────────────────────────────────
function renderClassificaLive(g,col){
  const cl=calcCl(g);const sets=g.sets||2;
  // Filtra per ricerca se attiva (anche in classifica mostra solo le squadre cercate evidenziate)
  const q=searchQuery.toLowerCase();
  let h=`<table><thead><tr><th>#</th><th>Squadra</th><th class="r">Pt</th>${sets===2?'<th class="r">DS</th>':''}<th class="r">DP</th><th></th></tr></thead><tbody>`;
  cl.forEach((t,i)=>{
    const isMatch=q&&t.nome.toLowerCase().includes(q);
    const isFavTeam=isFav(t.nome);
    if(q&&!isMatch&&!isFavTeam)return;
    const ri=i===0?'r1':i===1?'r2':i===2?'r3':'';
    h+=`<tr style="${isFavTeam?'background:rgba(251,191,36,0.08)':''}">
      <td class="rank ${ri}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td>
      <td><div style="display:flex;align-items:center;gap:6px">
        ${logoHtml(getSocLogo(DB.tornei[activeTorneoId],t.soc),22)}
        <div><div class="team-name">${t.nome}</div>${t.soc?`<div class="team-soc">${t.soc}</div>`:''}</div>
      </div></td>
      <td class="r"><span class="pts" style="color:${col}">${t.pt}</span></td>
      ${sets===2?`<td class="r"><span class="${t.ds>0?'ds-pos':t.ds<0?'ds-neg':''}">${t.ds>0?'+':''}${t.ds}</span></td>`:''}
      <td class="r" style="color:var(--txt2);font-size:12px">${t.dp>0?'+':''}${t.dp}</td>
      <td><button class="fav-star${isFavTeam?' active':''}" onclick="toggleFav('${t.nome.replace(/'/g,"\\'")}')">⭐</button></td>
    </tr>`;
  });
  return h+`</tbody></table>`;
}

// ── Partite ────────────────────────────────────────────────
function renderPartiteLive(g,col){
  const sets=g.sets||2;const q=searchQuery.toLowerCase();
  const andata=g.partite.filter(p=>!p.leg||p.leg===1);
  const ritorno=g.partite.filter(p=>p.leg===2);
  function partiteHtml(pList){
    return pList.map(p=>{
      const hn=g.squadre[p.h].nome,an=g.squadre[p.a].nome;
      const hs=g.squadre[p.h].soc||'',as=g.squadre[p.a].soc||'';
      const played=p.s1h!==''&&p.s1a!=='';
      const isFavMatch=isFav(hn)||isFav(an);
      const isMatch=!q||(hn.toLowerCase().includes(q)||an.toLowerCase().includes(q));
      if(q&&!isMatch)return'';
      let score='';if(played){score=`${p.s1h}–${p.s1a}`;if(sets===2&&p.s2h!=='')score+=` / ${p.s2h}–${p.s2a}`;}
      return`<div class="match-item${played?' played':''}${isFavMatch?' fav-highlight':''}">
        <div class="match-teams-live">
          <div style="display:flex;align-items:center;gap:5px">${logoHtml(getSocLogo(DB.tornei[activeTorneoId],hs),18)}<span>${hn}${hs?` <span class="match-soc-live">(${hs})</span>`:''}</span></div>
          <div style="color:var(--txt2);font-size:11px;margin:2px 0">vs</div>
          <div style="display:flex;align-items:center;gap:5px">${logoHtml(getSocLogo(DB.tornei[activeTorneoId],as),18)}<span>${an}${as?` <span class="match-soc-live">(${as})</span>`:''}</span></div>
        </div>
        ${p.leg===2?`<span style="font-size:9px;background:rgba(254,249,195,0.15);color:#fde047;padding:1px 5px;border-radius:4px;font-weight:600">RIT</span>`:''}
        ${played?`<div class="match-score-live" style="color:${col}">${score}</div>`:`<div class="match-pending">da giocare</div>`}
        <button class="fav-star${isFav(hn)||isFav(an)?' active':''}" onclick="toggleFav('${isFav(hn)?hn.replace(/'/g,"\\'"):an.replace(/'/g,"\\'")}')">⭐</button>
      </div>`;
    }).join('');
  }
  let h=partiteHtml(andata);
  if(ritorno.length)h+=`<div style="font-size:10px;font-weight:600;color:var(--txt2);text-transform:uppercase;padding:8px 14px 4px;border-top:1px solid var(--border)">Ritorno</div>`+partiteHtml(ritorno);
  return h||`<div style="padding:20px;text-align:center;color:var(--txt2);font-size:13px">Nessuna partita trovata</div>`;
}

// ── Eliminazione ───────────────────────────────────────────
function renderElimLive(fase,cat){
  const e=fase.elim||{};const col=cat.colore;
  const hasQ=e.q1||e.q2||e.q3||e.q4;
  const wFin=getWinner(e.fin12),lFin=getLoser(e.fin12),wFin34=getWinner(e.fin34);
  let html=`<div class="girone-card">
    <div class="girone-card-hdr" style="background:${col}18;border-bottom-color:${col}33">
      <span style="font-size:13px;font-weight:700;color:${col}">⚡ ${fase.label}</span>
    </div>`;
  if(wFin)html+=`<div class="podium-live">
    <div class="podium-item p2-live"><div style="font-size:20px">🥈</div><div class="podium-nome-live">${lFin||'—'}</div></div>
    <div class="podium-item p1-live"><div style="font-size:20px">🥇</div><div class="podium-nome-live">${wFin}</div></div>
    <div class="podium-item p3-live"><div style="font-size:20px">🥉</div><div class="podium-nome-live">${wFin34||'—'}</div></div>
  </div>`;
  function eMatch(m,title){
    if(!m)return'';const w=getWinner(m);const played=m.s1h!==''&&m.s1a!=='';
    return`<div class="elim-match">
      <div class="elim-match-title">${title}</div>
      <div class="elim-team-live${w===m.t1?' win':played?' lose':''}"><span>${m.t1||'—'}</span>${played?`<span class="elim-score">${m.s1h}</span>`:''}</div>
      <div class="elim-team-live${w===m.t2?' win':played?' lose':''}"><span>${m.t2||'—'}</span>${played?`<span class="elim-score">${m.s1a}</span>`:''}</div>
    </div>`;
  }
  html+=`<div class="elim-grid">`;
  if(hasQ){['q1','q2','q3','q4'].filter(k=>e[k]).forEach((k,i)=>{html+=eMatch(e[k],`Quarto ${i+1}: ${['1°vs8°','2°vs7°','3°vs6°','4°vs5°'][i]}`);});}
  if(e.sf1)html+=eMatch(e.sf1,'Semifinale 1');if(e.sf2)html+=eMatch(e.sf2,'Semifinale 2');
  if(e.fin12)html+=eMatch(e.fin12,'🏆 Finale 1°-2°');if(e.fin34&&e.fin34.t1&&e.fin34.t2)html+=eMatch(e.fin34,'Finale 3°-4°');
  html+=`</div></div>`;return html;
}

// ── Sponsor ────────────────────────────────────────────────
function mkSponsorCard(sp,sz){
  const gc=sz==='grande'?'lg':sz==='piccolo'?'sm':'md';
  const minH=sz==='grande'?'100px':sz==='piccolo'?'50px':'70px';
  let card=`<div class="sponsor-card ${gc}">`;
  if(sp.immagine){
    card+=`<div style="display:flex;align-items:center;justify-content:center;width:100%;min-height:${minH}">`;
    card+=`<img class="sponsor-img ${gc}" src="${sp.immagine}" alt="${esc(sp.nome||'')}" onerror="this.style.display='none'">`;
    card+=`</div>`;
  }
  if(sp.nome)card+=`<div class="sponsor-nome ${gc}">${esc(sp.nome)}</div>`;
  if(sp.frase)card+=`<div class="sponsor-frase ${gc}">${esc(sp.frase)}</div>`;
  if(!sp.immagine&&!sp.nome&&!sp.frase)card+=`<div style="color:var(--txt2);font-size:12px">Sponsor</div>`;
  card+=`</div>`;
  return card;
}

function renderSponsorPage(cfg){
  const cats=(cfg.sponsor&&cfg.sponsor.cats)||[];
  if(!cats.length)return`<div class="no-data"><p>Nessuno sponsor configurato.</p></div>`;
  let html='<div class="sponsor-page">';
  for(let ci=0;ci<cats.length;ci++){
    const cat=cats[ci];
    const items=cat.items||[];
    if(!items.length)continue;
    const grandi=items.filter(function(x){return x.size==='grande';});
    const medi=items.filter(function(x){return x.size==='medio'||!x.size;});
    const piccoli=items.filter(function(x){return x.size==='piccolo';});
    html+='<div class="sponsor-cat-section">';
    if(cat.nome)html+='<div class="sponsor-cat-title">'+esc(cat.nome)+'</div>';
    if(grandi.length){
      html+='<div class="sponsor-grid-lg">';
      for(var gi=0;gi<grandi.length;gi++)html+=mkSponsorCard(grandi[gi],'grande');
      html+='</div>';
    }
    if(medi.length){
      html+='<div class="sponsor-grid-md">';
      for(var mi=0;mi<medi.length;mi++)html+=mkSponsorCard(medi[mi],'medio');
      html+='</div>';
    }
    if(piccoli.length){
      html+='<div class="sponsor-grid-sm">';
      for(var pi=0;pi<piccoli.length;pi++)html+=mkSponsorCard(piccoli[pi],'piccolo');
      html+='</div>';
    }
    html+='</div>';
  }
  return html+'</div>';
}

// ── Info ───────────────────────────────────────────────────
function renderInfoPage(cfg){
  const blocks=cfg.infoBlocks||[];
  if(!blocks.length)return`<div class="no-data"><p>Nessuna informazione disponibile.</p></div>`;
  let html='<div class="info-page">';
  for(const b of blocks){
    if(!b.titolo&&!b.testo)continue;
    html+=`<div class="info-block">`;
    if(b.titolo)html+=`<div class="info-block-title">${esc(b.titolo)}</div>`;
    if(b.testo)html+=`<div class="info-block-body">${esc(b.testo)}</div>`;
    html+=`</div>`;
  }
  return html+'</div>';
}

// ── Menu ────────────────────────────────────────────────────
function renderMenuPage(cfg){
  const sezioni=cfg.menu?.sezioni||[];const note=cfg.menu?.note||'';
  if(!sezioni.length&&!note)return`<div class="no-data"><p>Menu non disponibile.</p></div>`;
  let html='<div class="menu-page">';
  if(note)html+=`<div class="menu-note">📝 ${esc(note)}</div>`;
  for(const sez of sezioni){
    const voci=sez.voci||[];if(!voci.length)continue;
    html+=`<div class="menu-sezione"><div class="menu-sezione-title">${esc(sez.nome)}</div>`;
    for(const v of voci){
      html+=`<div class="menu-voce">
        <div><div class="menu-voce-nome">${esc(v.nome)}</div>${v.desc?`<div class="menu-voce-desc">${esc(v.desc)}</div>`:''}</div>
        ${v.prezzo?`<div class="menu-voce-prezzo">${esc(normalizzaPrezzo(v.prezzo)||v.prezzo)}</div>`:''}
      </div>`;
    }
    html+=`</div>`;
  }
  return html+'</div>';
}

// ── La mia giornata ─────────────────────────────────────────
function renderGiornataPage(torneo){
  if(!FAVS.size)return`<div class="giornata-empty"><p>Nessuna squadra nei preferiti.<br>⭐ Aggiungi squadre dalla classifica o dalle partite!</p></div>`;
  let html='<div class="giornata-page">';
  html+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
    <div style="font-size:13px;color:var(--txt2)">Squadre seguite: ${[...FAVS].map(n=>`<strong style="color:#fbbf24">${n}</strong>`).join(', ')}</div>
    <button onclick="FAVS.clear();saveFavs();renderLive()" style="font-size:11px;padding:4px 10px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--txt2);cursor:pointer">Cancella tutto</button>
  </div>`;
  const cats=(torneo.categorie||[]);
  for(const cat of cats){
    const fasi=cat.fasi||[];let catHtml='';
    for(const fase of fasi){
      if(fase.tipo==='elim'){
        // Cerca le squadre preferite nel tabellone
        const e=fase.elim||{};
        const allMatches=[e.q1,e.q2,e.q3,e.q4,e.sf1,e.sf2,e.fin12,e.fin34].filter(Boolean);
        const rilevanti=allMatches.filter(m=>isFav(m.t1)||isFav(m.t2));
        if(rilevanti.length){
          catHtml+=`<div style="margin-bottom:10px"><div style="font-size:11px;color:var(--txt2);margin-bottom:6px">${fase.label}</div>`;
          for(const m of rilevanti){
            const w=getWinner(m);const played=m.s1h!==''&&m.s1a!=='';
            catHtml+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:6px">
              <div style="font-size:13px;font-weight:600${isFav(m.t1)?';color:#fbbf24':''}">${m.t1||'—'}${w===m.t1?' 🏆':''}</div>
              <div style="font-size:11px;color:var(--txt2);margin:3px 0">vs</div>
              <div style="font-size:13px;font-weight:600${isFav(m.t2)?';color:#fbbf24':''}">${m.t2||'—'}${w===m.t2?' 🏆':''}</div>
              ${played?`<div style="margin-top:6px;font-size:14px;font-weight:700;color:${cat.colore}">${m.s1h} – ${m.s1a}</div>`:'<div style="font-size:11px;color:var(--txt2);margin-top:4px">Da giocare</div>'}
            </div>`;
          }
          catHtml+=`</div>`;
        }
      } else {
        for(const g of(fase.gironi||[])){
          // Posizione in classifica
          const cl=calcCl(g);
          const favTeams=cl.filter(tt=>isFav(tt.nome));
          const sets=g.sets||2;
          if(favTeams.length){
            catHtml+=`<div style="margin-bottom:10px"><div style="font-size:11px;color:var(--txt2);margin-bottom:6px">${fase.label} — Girone ${g.label}</div>`;
            // Classifica ristretta
            favTeams.forEach(tt=>{
              const pos=cl.indexOf(tt)+1;
              catHtml+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">
                <div>
                  <div style="display:flex;align-items:center;gap:6px">
                    ${logoHtml(getSocLogo(torneo,tt.soc),24)}
                    <div>
                      <div style="font-size:14px;font-weight:700;color:#fbbf24">${tt.nome}</div>
                      ${tt.soc?`<div style="font-size:11px;color:var(--txt2)">${tt.soc}</div>`:''}
                    </div>
                  </div>
                </div>
                <div style="text-align:right">
                  <div style="font-size:20px;font-weight:800;color:${cat.colore}">${pos}°</div>
                  <div style="font-size:11px;color:var(--txt2)">${tt.pt} pt</div>
                </div>
              </div>`;
            });
            // Partite della/e squadra/e favorite
            const favParts=g.partite.filter(p=>isFav(g.squadre[p.h].nome)||isFav(g.squadre[p.a].nome));
            if(favParts.length){
              catHtml+=`<div style="font-size:11px;color:var(--txt2);margin:8px 0 4px">Partite</div>`;
              for(const p of favParts){
                const hn=g.squadre[p.h].nome,an=g.squadre[p.a].nome;
                const played=p.s1h!==''&&p.s1a!=='';let score='';
                if(played){score=`${p.s1h}–${p.s1a}`;if(sets===2&&p.s2h!=='')score+=` / ${p.s2h}–${p.s2a}`;}
                catHtml+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">
                  <div style="font-size:13px">
                    <span style="font-weight:600;color:${isFav(hn)?'#fbbf24':'inherit'}">${hn}</span>
                    <span style="color:var(--txt2);font-size:11px;margin:0 6px">vs</span>
                    <span style="font-weight:600;color:${isFav(an)?'#fbbf24':'inherit'}">${an}</span>
                  </div>
                  ${played?`<div style="font-size:14px;font-weight:700;color:${cat.colore}">${score}</div>`:`<div style="font-size:11px;color:var(--txt2)">da giocare</div>`}
                </div>`;
              }
            }
            catHtml+=`</div>`;
          }
        }
      }
    }
    if(catHtml){
      html+=`<div class="giornata-cat-section">
        <div class="giornata-cat-title" style="background:${cat.colore}22;color:${cat.colore}">${cat.emoji} ${cat.nome}</div>
        ${catHtml}
      </div>`;
    }
  }
  if(html==='<div class="giornata-page">'){html+='<div class="giornata-empty"><p>Le squadre preferite non hanno ancora partite registrate.</p></div>';}
  return html+'</div>';
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function getSocLogo(torneo,socNome){
  if(!socNome||!torneo||!torneo.societa)return'';
  const s=torneo.societa.find(x=>x.nome===socNome);
  return(s&&s.logo)||'';
}
function logoHtml(logo,size){
  if(!logo)return'';
  const sz=size||20;
  return`<img src="${logo}" style="width:${sz}px;height:${sz}px;object-fit:contain;border-radius:3px;background:#fff;padding:1px;flex-shrink:0" onerror="this.style.display='none'">`;
}
function normalizzaPrezzo(raw){
  if(!raw||!raw.toString().trim())return'';
  var s=raw.toString().replace(/€/g,'').trim();
  if(!s)return'';
  var hasDot=s.indexOf('.')>=0,hasComma=s.indexOf(',')>=0;
  if(hasDot&&hasComma){
    var ld=s.lastIndexOf('.'),lc2=s.lastIndexOf(',');
    if(lc2>ld){s=s.replace(/\./g,'').replace(',','.');}
    else{s=s.replace(/,/g,'');}
  } else if(hasComma){
    var parts=s.split(',');
    if(parts.length===2&&parts[1].length<=2)s=s.replace(',','.');
    else s=s.replace(/,/g,'');
  }
  var n=parseFloat(s);
  if(isNaN(n))return raw;
  return'€ '+n.toFixed(2).replace('.',',');
}


// ── QR Code ────────────────────────────────────────────────
let qrOpen=false,qrGenerated=false;
function toggleQR(){
  qrOpen=!qrOpen;const box=document.getElementById('qrBox');const btn=document.getElementById('qrToggleBtn');
  if(!box)return;
  if(qrOpen){
    const url=window.location.href.split('?')[0];document.getElementById('qrUrl').textContent=url;
    if(!qrGenerated){const wrap=document.getElementById('qrCode');wrap.innerHTML='';new QRCode(wrap,{text:url,width:160,height:160,colorDark:'#1a1a1a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});qrGenerated=true;}
    box.style.display='block';if(btn)btn.textContent='✕ Chiudi';
  } else {box.style.display='none';if(btn)btn.textContent='📱 QR';}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&qrOpen)toggleQR();});
