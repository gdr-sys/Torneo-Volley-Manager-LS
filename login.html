<!DOCTYPE html>
<html lang="it" style="color-scheme:light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Torneo Pallavolo Manager — Accedi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color-scheme: light;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo img { height: 72px; width: auto; }
    h1 { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 6px; color: #111; }
    .sub { text-align: center; font-size: 13px; color: #6b7280; margin-bottom: 28px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input {
      width: 100%; padding: 11px 14px; border: 1.5px solid #e5e7eb;
      border-radius: 8px; font-size: 15px; color: #111; background: #fff;
      margin-bottom: 16px; outline: none; transition: border-color .15s;
    }
    input:focus { border-color: #2d5fc4; }
    .btn {
      width: 100%; padding: 13px; background: #2d5fc4; color: #fff;
      border: none; border-radius: 8px; font-size: 16px; font-weight: 700;
      cursor: pointer; margin-top: 4px; transition: background .15s;
    }
    .btn:hover { background: #1e4aa0; }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .msg-error {
      background: #fee2e2; color: #991b1b; border-radius: 8px;
      padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none;
    }
    .msg-error.show { display: block; }
    .msg-success {
      background: #dcfce7; color: #166534; border-radius: 8px;
      padding: 10px 14px; font-size: 13px; margin-top: 12px; display: none;
    }
    .msg-success.show { display: block; }
    .msg-wait {
      background: #fef9c3; color: #854d0e; border-radius: 8px;
      padding: 14px; font-size: 13px; text-align: center;
      margin-top: 16px; display: none; line-height: 1.6;
    }
    .msg-wait.show { display: block; }
    .footer-note { text-align: center; font-size: 12px; color: #9ca3af; margin-top: 24px; }
    .footer-note a { color: #9ca3af; }
    .link { color: #2d5fc4; text-decoration: none; font-weight: 600; }
  </style>
</head>

  <h1>Torneo Pallavolo Manager</h1>
  <p class="sub">Accedi al tuo account</p>

  <div class="msg-error" id="errMsg"></div>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="la-tua@email.com" autocomplete="email">

  <label for="pwd">Password</label>
  <div style="position:relative">
    <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password" style="margin-bottom:16px;padding-right:44px">
    <button type="button" onclick="togglePwd()" id="pwdToggle"
      style="position:absolute;right:12px;top:11px;background:none;border:none;cursor:pointer;font-size:16px;color:#6b7280;padding:0">
      👁
    </button>
  </div>

  <button class="btn" id="loginBtn" onclick="doLogin()">Accedi</button>

  <p style="text-align:center;margin-top:14px;font-size:13px">
    <a href="#" onclick="doResetPassword();return false;" class="link">Password dimenticata?</a>
  </p>

  <div class="msg-success" id="resetMsg">
    ✓ Email di recupero inviata! Controlla la tua casella.
  </div>

  <div class="msg-wait" id="notActive">
    ⏳ Il tuo account è in attesa di attivazione.<br>
    Hai già effettuato il pagamento?<br>
    Scrivi a <a href="mailto:noemi.marcolini@gmail.com" class="link">noemi.marcolini@gmail.com</a>
  </div>
</div>

<p class="footer-note">
  Non hai ancora un account? <a href="landing.html">Scopri il prodotto</a>
</p>

<!-- Firebase compat -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyB-vk1m84YC8ZBMHHvILdgpAfZyp4C_0ZM",
    authDomain: "torneo-pallavolo-manager.firebaseapp.com",
    projectId: "torneo-pallavolo-manager",
    storageBucket: "torneo-pallavolo-manager.firebasestorage.app",
    messagingSenderId: "423674754433",
    appId: "1:423674754433:web:35dfeb868d726f6272a480"
  });

  const auth = firebase.auth();
  const db = firebase.firestore();

  // Se già loggato e attivo → vai all'app
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      const snap = await db.collection('utenti').doc(user.uid).get();
      if (snap.exists && snap.data().attivo === true) {
        window.location.href = 'index.html';
      }
    }
  });

  function showErr(msg) {
    const el = document.getElementById('errMsg');
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideAll() {
    document.getElementById('errMsg').classList.remove('show');
    document.getElementById('resetMsg').classList.remove('show');
    document.getElementById('notActive').classList.remove('show');
  }

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const pwd = document.getElementById('pwd').value;
    const btn = document.getElementById('loginBtn');
    hideAll();

    if (!email || !pwd) { showErr('Inserisci email e password.'); return; }

    btn.disabled = true;
    btn.textContent = 'Accesso in corso...';

    try {
      const cred = await auth.signInWithEmailAndPassword(email, pwd);
      const snap = await db.collection('utenti').doc(cred.user.uid).get();
      if (snap.exists && snap.data().attivo === true) {
        window.location.href = 'index.html';
      } else {
        document.getElementById('notActive').classList.add('show');
        await auth.signOut();
        btn.disabled = false;
        btn.textContent = 'Accedi';
      }
    } catch(e) {
      const msgs = {
        'auth/user-not-found': 'Email non trovata.',
        'auth/wrong-password': 'Password errata.',
        'auth/invalid-email': 'Email non valida.',
        'auth/too-many-requests': 'Troppi tentativi. Riprova tra qualche minuto.',
        'auth/invalid-credential': 'Email o password errati.',
      };
      showErr(msgs[e.code] || 'Errore di accesso. Riprova.');
      btn.disabled = false;
      btn.textContent = 'Accedi';
    }
  }

  function togglePwd() {
    const input = document.getElementById('pwd');
    const btn = document.getElementById('pwdToggle');
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
    } else {
      input.type = 'password';
      btn.textContent = '👁';
    }
  }

  async function doResetPassword() {
    const email = document.getElementById('email').value.trim();
    hideAll();
    if (!email) { showErr('Inserisci la tua email per recuperare la password.'); return; }
    try {
      await auth.sendPasswordResetEmail(email);
      document.getElementById('resetMsg').classList.add('show');
    } catch(e) {
      showErr(e.code === 'auth/user-not-found' ? 'Email non trovata.' : 'Errore. Riprova.');
    }
  }

  document.getElementById('pwd').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });
</script>
